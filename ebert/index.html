<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lançamentos">
<meta name="theme-color" content="#f3f5f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Lançamentos</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#1d232a;--mut:#6c7682;--line:#e3e7ec;--acc:#2d5f8a;--ok:#2f8f5b;--warn:#d39b16;--bad:#c0392b;--soft:#e9edf1;--rec:#2f8f5b;--des:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
header h1{font-size:22px;margin:0;letter-spacing:-.3px}
header small{display:block;color:var(--mut);font-size:13px;font-weight:400}
.ico{border:0;background:var(--card);width:42px;height:42px;border-radius:50%;font-size:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--ink)}
.abas{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.abas::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hero{background:var(--card);border-radius:20px;padding:16px 18px 18px;margin-top:12px;box-shadow:0 2px 10px rgba(20,40,60,.06)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.nav button{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--ink)}
.nav .t{text-align:center;font-weight:600}
.nav .t small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.tot{font-size:36px;font-weight:700;letter-spacing:-1px;text-align:center;margin:8px 0 0}
.de{text-align:center;color:var(--mut);font-size:14px}
.bar{height:12px;border-radius:8px;background:var(--soft);margin:14px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;transition:width .3s}
.disp{display:flex;justify-content:space-between;font-size:14px}
.datas{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;text-align:center}
.tres div{background:var(--soft);border-radius:12px;padding:10px 4px}
.tres small{display:block;color:var(--mut);font-size:12px}
.tres b{font-size:15px}
.lnk{border:0;background:none;color:var(--acc);font-size:13px;padding:4px 0}
.aviso{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff6dd;border:1px solid #f0dc9a}
.aviso.forte{background:#fdeaea;border-color:#efb7b2}
.aviso button{flex:none}
h2{font-size:15px;color:var(--mut);font-weight:600;margin:22px 4px 8px;display:flex;justify-content:space-between}
.lista{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(20,40,60,.05)}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .d{width:38px;text-align:center;color:var(--mut);font-size:12px;line-height:1.1}
.it .d b{display:block;font-size:17px;color:var(--ink)}
.it .n{flex:1;min-width:0}
.it .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .n small{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .v{font-weight:600;white-space:nowrap}
.v.rec{color:var(--rec)}
.pend{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:4px;vertical-align:middle}
.vazio{padding:28px 16px;text-align:center;color:var(--mut);font-size:14px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:600;background:var(--acc);color:#fff}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:active{opacity:.8}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:488px;font-size:17px;padding:16px;border-radius:18px;box-shadow:0 6px 20px rgba(45,95,138,.35)}
.enviar{margin:18px 0 0}
.vel{position:fixed;inset:0;background:rgba(10,20,30,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:f .15s}
.folha{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;animation:s .2s}
@keyframes f{from{opacity:0}}@keyframes s{from{transform:translateY(40px)}}
.alca{width:40px;height:5px;border-radius:3px;background:#cfd6dd;margin:0 auto 10px}
.folha h3{margin:0 0 12px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.campo{background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.campo label,.rot{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.campo input,.campo textarea{width:100%;border:0;outline:0;font:inherit;font-size:17px;background:none;color:var(--ink);padding:2px 0}
.campo input[type=date]{min-height:28px}
.campo.valor input{font-size:30px;font-weight:700}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-size:15px;font-weight:600;color:var(--mut)}
.seg button.on.des{background:var(--card);color:var(--des);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button.on.rec{background:var(--card);color:var(--rec);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{padding:7px 12px}
.parc{display:flex;align-items:center;justify-content:space-between}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:20px;color:var(--ink)}
.step span{min-width:44px;text-align:center;font-weight:600}
.dica{font-size:13px;color:var(--mut);margin:2px 4px 14px}
.acoes{display:flex;gap:10px;margin-top:6px}.acoes .btn{flex:1}
.del{background:none;color:var(--bad);border:0;font-size:15px;padding:14px;width:100%}
.grupo{background:var(--card);border-radius:14px;margin-bottom:14px;overflow:hidden}
.grupo .campo{margin:0;border-radius:0;border-bottom:1px solid var(--line)}
.grupo .campo:last-child{border-bottom:0}
.grupo .tit{padding:10px 14px 0;font-weight:600}
.duas{display:flex}.duas .campo{flex:1}
.sec-t{font-size:13px;color:var(--mut);margin:16px 4px 6px;text-transform:uppercase;letter-spacing:.4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#1f2830;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="btn fab" onclick="abrirLanc()">+ Novo lançamento</button>
<input type="file" id="arqRest" accept=".json,application/json" hidden onchange="restaurar(this)">
<script>
const KEY='lancamentos_ebert_v1',VERSAO='1.0';
const PADRAO={cfg:{nome:'Ebert',pessoas:['Erika'],contas:[
  {id:'cc',nome:'Conta Santander',cartao:false},
  {id:'mc',nome:'Santander Mastercard',cartao:true,limite:1000,venc:27,diasAntes:7,diaFech:null,fech:{}},
  {id:'visa',nome:'Santander Visa',cartao:true,limite:1000,venc:12,diasAntes:7,diaFech:null,fech:{}},
  {id:'sic',nome:'Sicoob Mastercard',cartao:true,limite:1000,venc:11,diasAntes:null,diaFech:1,fech:{}}]},
  itens:[],sel:'cc',ultEnvio:null};
let S=carregar(),ver=null;
function carregar(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cfg)return{...JSON.parse(JSON.stringify(PADRAO)),...s}}catch(e){}return JSON.parse(JSON.stringify(PADRAO))}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Não foi possível salvar no celular.')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const $=id=>document.getElementById(id);
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>iso(new Date());
const ym=s=>s.slice(0,7);
function addM(m,k){let[y,mm]=m.split('-').map(Number);mm+=k;y+=Math.floor((mm-1)/12);mm=((mm-1)%12+12)%12+1;return y+'-'+pad(mm)}
const ultDia=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const dm=s=>s.slice(8,10)+'/'+s.slice(5,7);
const nomeMes=m=>MES[+m.slice(5,7)-1];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const conta=id=>S.cfg.contas.find(c=>c.id===id)||S.cfg.contas[0];

/* faturas (identificadas pelo mês do vencimento) */
function venc(c,m){return m+'-'+pad(Math.min(c.venc,ultDia(m)))}
function fech(c,m){
  if(c.fech&&c.fech[m])return c.fech[m];
  if(c.diaFech){const mf=c.diaFech<c.venc?m:addM(m,-1);return mf+'-'+pad(Math.min(c.diaFech,ultDia(mf)))}
  const d=new Date(venc(c,m)+'T12:00');d.setDate(d.getDate()-(c.diasAntes||7));return iso(d)}
function faturaDe(c,data){let m=addM(ym(data),-1);for(let i=0;i<4;i++,m=addM(m,1))if(data<fech(c,m))return m;return m}
function partes(it){const c=conta(it.conta);
  if(!c.cartao)return[{it,k:1,n:1,per:ym(it.data),v:it.valor}];
  const n=it.tipo==='receita'?1:Math.max(1,it.parcelas||1),cc=Math.round(it.valor*100),b=Math.floor(cc/n),r=cc-b*n,f=faturaDe(c,it.data);
  return Array.from({length:n},(_,i)=>({it,k:i+1,n,per:addM(f,i),v:(b+(i===0?r:0))/100}))}
function doPeriodo(cid,m){return S.itens.filter(i=>!i.del&&i.conta===cid).flatMap(partes).filter(p=>p.per===m).sort((a,b)=>b.it.data.localeCompare(a.it.data)||b.it.criado.localeCompare(a.it.criado))}
const pendentes=()=>S.itens.filter(i=>!i.enviado);
const periodoAtual=c=>c.cartao?faturaDe(c,hoje()):ym(hoje());

function render(){
  const c=conta(S.sel),atual=periodoAtual(c);if(!ver)ver=atual;
  const ps=doPeriodo(c.id,ver),pend=pendentes();
  const velho=pend.some(i=>(Date.now()-new Date(i.alterado||i.criado))>3*864e5);
  let hero;
  if(c.cartao){
    const tot=ps.reduce((s,p)=>s+(p.it.tipo==='receita'?-p.v:p.v),0),lim=+c.limite||0,pct=lim?tot/lim*100:0;
    const cor=pct>100?'var(--bad)':pct>=80?'var(--warn)':'var(--ok)',rest=lim-tot,fechou=hoje()>=fech(c,ver);
    const rot=ver===atual?'Fatura atual':ver<atual?'Fatura fechada':'Próxima fatura';
    hero=`<div class="nav"><button onclick="mudar(-1)" aria-label="Anterior">‹</button><div class="t">Fatura de ${nomeMes(ver)}<small>${rot}</small></div><button onclick="mudar(1)" aria-label="Próxima">›</button></div>
    <div class="tot">${brl(tot)}</div><div class="de">de ${brl(lim)} de limite</div>
    <div class="bar"><i style="width:${Math.max(0,Math.min(100,pct)).toFixed(1)}%;background:${cor}"></i></div>
    <div class="disp"><span style="color:${cor};font-weight:600">${rest>=0?'Disponível '+brl(rest):'Passou '+brl(-rest)}</span><span>${pct.toFixed(0)}%</span></div>
    <div class="datas"><span>${fechou?'Fechou':'Fecha'} ${dm(fech(c,ver))} · vence ${dm(venc(c,ver))}</span><button class="lnk" onclick="abrirFech('${ver}')">alterar fechamento</button></div>`;
  }else{
    const rec=ps.filter(p=>p.it.tipo==='receita').reduce((s,p)=>s+p.v,0),des=ps.filter(p=>p.it.tipo!=='receita').reduce((s,p)=>s+p.v,0),res=rec-des;
    hero=`<div class="nav"><button onclick="mudar(-1)" aria-label="Anterior">‹</button><div class="t">${nomeMes(ver)[0].toUpperCase()+nomeMes(ver).slice(1)} ${ver.slice(0,4)}<small>${ver===atual?'Mês atual':'lançados pelo celular'}</small></div><button onclick="mudar(1)" aria-label="Próximo">›</button></div>
    <div class="tres"><div><small>Receitas</small><b style="color:var(--rec)">${brl(rec)}</b></div><div><small>Despesas</small><b style="color:var(--des)">${brl(des)}</b></div><div><small>Resultado</small><b style="color:${res>=0?'var(--rec)':'var(--des)'}">${brl(res)}</b></div></div>
    <p class="dica" style="margin:10px 2px 0">Só o que foi lançado neste app, não é o saldo do banco.</p>`;
  }
  $('app').innerHTML=`
  <header><h1>Lançamentos<small>${esc(S.cfg.nome)}</small></h1><button class="ico" onclick="abrirAjustes()" aria-label="Ajustes">⚙︎</button></header>
  <div class="abas">${S.cfg.contas.map(x=>`<button class="chip ${x.id===c.id?'on':''}" onclick="selConta('${x.id}')">${esc(x.nome)}</button>`).join('')}</div>
  <section class="hero">${hero}</section>
  ${pend.length?`<div class="aviso ${velho?'forte':''}"><span>${pend.length===1?'1 lançamento ainda não foi enviado':pend.length+' lançamentos ainda não foram enviados'} ao programa${velho?' — há mais de 3 dias':''}.</span><button class="btn sm" onclick="enviar()">Enviar</button></div>`:''}
  <h2><span>Lançamentos</span><span>${ps.length||''}</span></h2>
  <div class="lista">${ps.length?ps.map(p=>{const it=p.it,sub=[p.n>1?`parcela ${p.k}/${p.n} · total ${brl(it.valor)}`:'',(it.pessoas||[]).join(', '),it.obs||''].filter(Boolean).join(' · ');
    return`<div class="it" onclick="abrirLanc('${it.id}')"><div class="d"><b>${it.data.slice(8)}</b>${MES[+it.data.slice(5,7)-1].slice(0,3)}</div><div class="n"><div>${esc(it.desc||(it.tipo==='receita'?'Receita':'Despesa'))}${it.enviado?'':'<span class="pend" title="não enviado"></span>'}</div>${sub?`<small>${esc(sub)}</small>`:''}</div><div class="v ${it.tipo==='receita'?'rec':''}">${it.tipo==='receita'?'+ ':''}${brl(p.v)}</div></div>`}).join(''):`<div class="vazio">Nada lançado aqui ${c.cartao?'nesta fatura':'neste mês'}.</div>`}</div>
  <button class="btn sec full enviar" onclick="enviar()">Enviar para o programa</button>
  <p class="dica" style="text-align:center;margin-top:10px">${S.ultEnvio?'Último envio: '+new Date(S.ultEnvio).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'Nada enviado ainda'}</p>`;
}
function mudar(k){ver=addM(ver,k);render()}
function selConta(id){S.sel=id;ver=null;salvar();render()}

function folha(html){fechar();const v=document.createElement('div');v.className='vel';v.id='vel';v.innerHTML=`<div class="folha"><div class="alca"></div>${html}</div>`;v.addEventListener('click',e=>{if(e.target===v)fechar()});document.body.appendChild(v)}
function fechar(){const v=$('vel');if(v)v.remove()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* novo lançamento / editar */
let F={};
function abrirLanc(id){
  const it=id?S.itens.find(i=>i.id===id):null;
  F={id,cent:it?Math.round(it.valor*100):0,n:it?it.parcelas||1:1,tipo:it?it.tipo:'despesa',conta:it?it.conta:S.sel,pes:it?[...(it.pessoas||[])]:[]};
  const todas=[...new Set([...S.cfg.pessoas,...F.pes])];
  folha(`<h3>${it?'Editar lançamento':'Novo lançamento'}<button class="lnk" onclick="fechar()">Cancelar</button></h3>
  <div class="seg"><button id="tD" class="des" onclick="tipo('despesa')">Despesa</button><button id="tR" class="rec" onclick="tipo('receita')">Receita</button></div>
  <div class="campo valor"><label>Valor${''}</label><input id="fv" inputmode="numeric" autocomplete="off"></div>
  <div class="campo"><label>Conta</label><div class="chips" id="fc">${S.cfg.contas.map(x=>`<button class="chip" data-c="${x.id}" onclick="selC('${x.id}')">${esc(x.nome)}</button>`).join('')}</div></div>
  <div class="campo"><label>Descrição</label><input id="fd" maxlength="80" placeholder="Ex.: mercado, combustível…" value="${esc(it?it.desc:'')}" autocomplete="off"></div>
  <div class="campo"><label>Data</label><input id="fdt" type="date" value="${it?it.data:hoje()}" onchange="dica()"></div>
  <div class="campo parc" id="bParc"><div><label>Parcelas</label><div id="pv" style="font-size:14px;color:var(--mut)"></div></div><div class="step"><button onclick="parc(-1)" aria-label="Menos">−</button><span id="pn"></span><button onclick="parc(1)" aria-label="Mais">+</button></div></div>
  <div class="campo"><label>Pessoa (opcional — para quem foi)</label><div class="chips" id="fp">${todas.length?todas.map(p=>`<button class="chip" data-p="${esc(p)}" onclick="selP(this)">${esc(p)}</button>`).join(''):'<span class="dica" style="margin:0">Cadastre nomes em Ajustes.</span>'}</div></div>
  <div class="campo"><label>Observação (opcional)</label><input id="fo" maxlength="120" value="${esc(it?it.obs||'':'')}" autocomplete="off"></div>
  <p class="dica" id="fdica"></p>
  <button class="btn full" onclick="salvarLanc()">Salvar</button>
  ${it?`<button class="del" onclick="excluir('${it.id}')">Excluir lançamento</button>`:''}`);
  const fv=$('fv');fv.addEventListener('input',()=>{F.cent=+fv.value.replace(/\D/g,'').slice(-11)||0;atualizar()});
  document.querySelectorAll('#fp .chip').forEach(b=>b.classList.toggle('on',F.pes.includes(b.dataset.p)));
  atualizar();if(!it)setTimeout(()=>fv.focus(),250);
}
function tipo(t){F.tipo=t;atualizar()}
function selC(id){F.conta=id;atualizar()}
function selP(b){const p=b.dataset.p,i=F.pes.indexOf(p);if(i<0)F.pes.push(p);else F.pes.splice(i,1);b.classList.toggle('on',i<0)}
function parc(k){F.n=Math.min(48,Math.max(1,F.n+k));atualizar()}
function atualizar(){
  const c=conta(F.conta),usaParc=c.cartao&&F.tipo==='despesa';
  $('fv').value=brl(F.cent/100);
  $('tD').classList.toggle('on',F.tipo==='despesa');$('tR').classList.toggle('on',F.tipo==='receita');
  document.querySelectorAll('#fc .chip').forEach(b=>b.classList.toggle('on',b.dataset.c===F.conta));
  $('bParc').style.display=usaParc?'':'none';
  $('pn').textContent=F.n+'×';$('pv').textContent=F.n>1?F.n+' de '+brl(F.cent/100/F.n):'à vista';
  dica();
}
function dica(){const d=$('fdt').value,c=conta(F.conta),el=$('fdica');if(!d){el.textContent='';return}
  if(!c.cartao){el.textContent=F.tipo==='receita'?'Entrada na conta corrente.':'Saída da conta corrente.';return}
  const f=faturaDe(c,d),n=F.tipo==='despesa'?F.n:1;
  el.textContent=F.tipo==='receita'?`Crédito/estorno na fatura de ${nomeMes(f)} (vence ${dm(venc(c,f))}).`:n>1?`1ª parcela na fatura de ${nomeMes(f)} (vence ${dm(venc(c,f))}), última em ${nomeMes(addM(f,n-1))}.`:`Entra na fatura de ${nomeMes(f)} (vence ${dm(venc(c,f))}).`}
function salvarLanc(){
  if(!F.cent){toast('Informe o valor');return}
  const c=conta(F.conta),d=$('fdt').value||hoje(),agora=new Date().toISOString();
  const dados={tipo:F.tipo,conta:c.id,valor:F.cent/100,desc:$('fd').value.trim(),data:d,parcelas:c.cartao&&F.tipo==='despesa'?F.n:1,pessoas:[...F.pes],obs:$('fo').value.trim()};
  if(F.id){const it=S.itens.find(i=>i.id===F.id);Object.assign(it,dados,{alterado:agora,enviado:null})}
  else S.itens.push({id:uid(),...dados,criado:agora,alterado:agora,enviado:null});
  S.sel=c.id;salvar();fechar();ver=c.cartao?faturaDe(c,d):ym(d);render();toast('Lançamento salvo');
}
function excluir(id){
  if(!confirm('Excluir este lançamento?'))return;
  const i=S.itens.findIndex(x=>x.id===id),it=S.itens[i];
  if(it.enviadoAlgumaVez){it.del=true;it.alterado=new Date().toISOString();it.enviado=null}else S.itens.splice(i,1);
  salvar();fechar();render();
}

/* fechamento variável */
function abrirFech(m){const c=conta(S.sel);
  folha(`<h3>${esc(c.nome)} — ${nomeMes(m)}<button class="lnk" onclick="fechar()">Cancelar</button></h3>
  <div class="campo"><label>Data de fechamento desta fatura</label><input id="ff" type="date" value="${fech(c,m)}"></div>
  <p class="dica">Se neste mês o cartão fechar em outro dia, troque aqui. Compras a partir do dia do fechamento vão para a fatura seguinte.</p>
  <div class="acoes">${c.fech&&c.fech[m]?`<button class="btn sec" onclick="salvarFech('${m}',true)">Usar o normal</button>`:''}<button class="btn" onclick="salvarFech('${m}')">Salvar</button></div>`)}
function salvarFech(m,limpar){const c=conta(S.sel),v=$('ff').value;c.fech=c.fech||{};if(limpar||!v)delete c.fech[m];else c.fech[m]=v;salvar();fechar();render()}

/* ajustes */
function abrirAjustes(){
  const cs=S.cfg.contas;
  folha(`<h3>Ajustes<button class="lnk" onclick="fechar()">Fechar</button></h3>
  <div class="sec-t">Contas e cartões</div>
  ${cs.map(c=>`<div class="grupo"><div class="campo"><label>Nome</label><input id="n_${c.id}" value="${esc(c.nome)}"></div>
   ${c.cartao?`<div class="duas"><div class="campo"><label>Limite (R$)</label><input id="l_${c.id}" inputmode="decimal" value="${String(c.limite).replace('.',',')}"></div><div class="campo"><label>Vencimento (dia)</label><input id="v_${c.id}" inputmode="numeric" value="${c.venc}"></div></div>
   <div class="duas"><div class="campo"><label>Fecha quantos dias antes</label><input id="a_${c.id}" inputmode="numeric" value="${c.diasAntes||''}" placeholder="—"></div><div class="campo"><label>ou fecha sempre no dia</label><input id="f_${c.id}" inputmode="numeric" value="${c.diaFech||''}" placeholder="—"></div></div>`:''}</div>`).join('')}
  <p class="dica">Fechamento: preencha só um dos dois. “Dia fixo” vale para cartões como o Sicoob, que fecha sempre no dia 01.</p>
  <div class="sec-t">Pessoas da família</div>
  <div class="grupo"><div class="campo"><label>Nomes, separados por vírgula</label><input id="aPes" value="${esc(S.cfg.pessoas.join(', '))}" placeholder="Erika, …"></div></div>
  <p class="dica">Use os mesmos nomes do campo Pessoas do programa, para a importação já marcar certo.</p>
  <button class="btn full" onclick="salvarAjustes()">Salvar ajustes</button>
  <div class="sec-t">Cópia de segurança</div>
  <p class="dica">Para trocar de celular ou reinstalar o app.</p>
  <div class="acoes"><button class="btn sec" onclick="copiaTudo()">Salvar cópia</button><button class="btn sec" onclick="$('arqRest').click()">Restaurar cópia</button></div>
  <button class="btn sec full" style="margin-top:10px" onclick="enviar(true)">Reenviar tudo para o programa</button>
  <p class="dica" style="text-align:center;margin-top:16px">Os dados ficam só neste celular. Versão ${VERSAO}</p>`)}
function salvarAjustes(){
  const num=v=>parseFloat(String(v).replace(/\./g,'').replace(',','.'));
  for(const c of S.cfg.contas){
    const nm=$('n_'+c.id).value.trim();if(!nm){toast('Nome de conta vazio');return}
    if(c.cartao){const l=num($('l_'+c.id).value),v=parseInt($('v_'+c.id).value),a=parseInt($('a_'+c.id).value)||null,f=parseInt($('f_'+c.id).value)||null;
      if(!(l>0)){toast('Limite inválido em '+nm);return}
      if(!(v>=1&&v<=31)){toast('Vencimento inválido em '+nm);return}
      if(!a&&!f){toast('Informe o fechamento de '+nm);return}
      if(f&&(f<1||f>31)){toast('Dia de fechamento inválido em '+nm);return}
      Object.assign(c,{limite:l,venc:v,diaFech:f,diasAntes:f?null:a})}
    c.nome=nm}
  S.cfg.pessoas=$('aPes').value.split(',').map(s=>s.trim()).filter(Boolean);
  salvar();fechar();ver=null;render();toast('Ajustes salvos');
}

/* envio para o programa */
async function compartilhar(nome,obj,texto){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}),file=new File([blob],nome,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:nome,text:texto});return true}catch(e){if(e.name==='AbortError')return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();
  return confirm('O arquivo foi salvo em Downloads. Marcar como enviado?');
}
async function enviar(tudo){
  const lista=tudo?S.itens:pendentes();
  if(!lista.length){if(confirm('Não há lançamentos novos. Quer reenviar tudo?'))return enviar(true);return}
  const agora=new Date().toISOString();
  const obj={app:'lancamentos-celular',v:1,origem:S.cfg.nome,gerado:agora,completo:!!tudo,
    contas:S.cfg.contas.map(c=>({id:c.id,nome:c.nome,cartao:c.cartao,venc:c.venc||null})),
    itens:lista.map(i=>{const c=conta(i.conta);return{id:i.id,tipo:i.tipo,conta:c.nome,contaId:c.id,cartao:c.cartao,data:i.data,desc:i.desc,valor:i.valor,parcelas:i.parcelas||1,pessoas:i.pessoas||[],obs:i.obs||'',...(c.cartao?{fatura:faturaDe(c,i.data)}:{}),criado:i.criado,alterado:i.alterado,...(i.del?{excluido:true}:{})}})};
  const ok=await compartilhar(`lancamentos_ebert_${hoje()}_${agora.slice(11,16).replace(':','h')}.json`,obj,`${lista.length} lançamento(s)`);
  if(!ok)return;
  lista.forEach(i=>{i.enviado=agora;i.enviadoAlgumaVez=true});
  S.itens=S.itens.filter(i=>!(i.del&&i.enviado));S.ultEnvio=agora;salvar();render();toast('Enviado ✓');
}
async function copiaTudo(){await compartilhar(`copia_lancamentos_${hoje()}.json`,{app:'lancamentos-celular-copia',v:1,dados:S},'Cópia de segurança');toast('Cópia pronta')}
function restaurar(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=='lancamentos-celular-copia'||!o.dados||!o.dados.cfg)throw 0;if(!confirm('Substituir tudo o que está no app por esta cópia?'))return;S=o.dados;salvar();fechar();ver=null;render();toast('Cópia restaurada')}catch(e){alert('Este arquivo não é uma cópia deste app.')}};r.readAsText(f)}

render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
